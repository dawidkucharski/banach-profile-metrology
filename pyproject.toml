[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btri"
version = "0.1.0"
description = "Banach-space texture and roundness imaging pipeline for interferometric datasets"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pillow>=10.0",
    "matplotlib>=3.7",
]

[project.scripts]
btri-run = "btri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
